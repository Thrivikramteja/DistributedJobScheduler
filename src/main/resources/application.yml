spring:
  application:
    name: task-dispatch-engine
  jackson:
    serialization:
      write-dates-as-timestamps: false
  scheduler:
    stale-threshold-minutes: 15
    stale-check-interval-ms: 60000
    executor:
      pool-size: 4

  datasource:
    url: jdbc:postgresql://localhost:5432/scheduler
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
